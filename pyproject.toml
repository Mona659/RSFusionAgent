[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsfusion-agent"
version = "0.7.0"
description = "An executable agent for remote sensing image fusion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mona659" }
]
dependencies = [
  "h5py>=3.10,<4.0",
  "numpy>=1.24,<3.0",
  "pillow>=10.0,<13.0",
  "pydantic>=2.7,<3.0",
  "rasterio>=1.3.10,<2.0",
  "scikit-image>=0.23,<1.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.68,<3.0",
]
ui = [
  "streamlit>=1.39,<2.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
rsfusion = "rsfusion_agent.cli:main"
rsfusion-ui = "rsfusion_agent.ui.streamlit_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
exclude = ["src/rsfusion_agent/models/dc_stsf.py"]

